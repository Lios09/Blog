name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  HUSKY: '0'
  NODE_VERSION_FILE: .node-version
  PNPM_LOCKFILE: pnpm-lock.yaml

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: ${{ env.PNPM_LOCKFILE }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        if: matrix.check == 'build'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(env.NODE_VERSION_FILE, env.PNPM_LOCKFILE) }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(env.NODE_VERSION_FILE, env.PNPM_LOCKFILE) }}-
      - name: Run ${{ matrix.check }}
        run: pnpm run "${{ matrix.check }}"

