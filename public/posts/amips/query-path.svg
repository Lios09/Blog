<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" role="img" aria-labelledby="t2 d2">
<title id="t2">三条查询路径和离线训练</title>
<desc id="d2">上方是三条在线查询路径。普通 IVF：查询与所有质心算内积，取前 nprobe 个簇扫描。SupportNet 路由：一次前向输出每个簇的支撑函数估计，按估计值选簇再精确扫描。KeyNet 改写：先把 q 变成预测的最佳 key ŷ，再交给原封不动的 IVF 索引。可选地用原始 q 对候选重排，这一步是作者之外的补充。下方是离线阶段：采样查询并加高斯噪声，穷举求每个簇内的最佳 key，训练网络。</desc>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="980" height="720" fill="#f7f4ee"/>
<g font-family="'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans',system-ui,sans-serif">
<text x="490" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2933">学出来的东西插在哪：换路由，或者换查询</text>
<text x="490" y="60" text-anchor="middle" font-size="13" fill="#5b6770">倒排索引本身（k-means 分簇 + 簇内扫描）在三条路径里都没变</text>
<text x="30" y="78" font-size="15" font-weight="700" fill="#5b6770">普通 IVF</text>
<rect x="30" y="90" width="200" height="100" rx="10" fill="#ffffff" stroke="#5b6770" stroke-width="1.6"/><path d="M40,90 V190 A10,10 0 0 1 30,180 V100 A10,10 0 0 1 40,90 Z" fill="#5b6770"/><text x="52" y="116" font-size="14" font-weight="700" fill="#5b6770">查询 q</text><text x="52" y="138" font-size="12" fill="#1f2933">短问题的 embedding</text>
<line x1="230" y1="140" x2="268" y2="140" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="270" y="90" width="200" height="100" rx="10" fill="#ffffff" stroke="#5b6770" stroke-width="1.6"/><path d="M280,90 V190 A10,10 0 0 1 270,180 V100 A10,10 0 0 1 280,90 Z" fill="#5b6770"/><text x="292" y="116" font-size="14" font-weight="700" fill="#5b6770">质心打分</text><text x="292" y="138" font-size="12" fill="#1f2933">⟨q, c_j⟩，j = 1..k</text><text x="292" y="157" font-size="12" fill="#1f2933">k 次内积</text>
<line x1="470" y1="140" x2="508" y2="140" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="510" y="90" width="200" height="100" rx="10" fill="#ffffff" stroke="#5b6770" stroke-width="1.6"/><path d="M520,90 V190 A10,10 0 0 1 510,180 V100 A10,10 0 0 1 520,90 Z" fill="#5b6770"/><text x="532" y="116" font-size="14" font-weight="700" fill="#5b6770">选簇</text><text x="532" y="138" font-size="12" fill="#1f2933">取前 nprobe 个</text><text x="532" y="157" font-size="12" fill="#1f2933">（按平均水平）</text>
<line x1="710" y1="140" x2="748" y2="140" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="750" y="90" width="200" height="100" rx="10" fill="#ffffff" stroke="#5b6770" stroke-width="1.6"/><path d="M760,90 V190 A10,10 0 0 1 750,180 V100 A10,10 0 0 1 760,90 Z" fill="#5b6770"/><text x="772" y="116" font-size="14" font-weight="700" fill="#5b6770">簇内扫描</text><text x="772" y="138" font-size="12" fill="#1f2933">精确内积</text><text x="772" y="157" font-size="12" fill="#1f2933">返回候选</text>
<text x="30" y="238" font-size="15" font-weight="700" fill="#1f6feb">SupportNet 路由</text>
<rect x="30" y="250" width="200" height="100" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><path d="M40,250 V350 A10,10 0 0 1 30,340 V260 A10,10 0 0 1 40,250 Z" fill="#1f6feb"/><text x="52" y="276" font-size="14" font-weight="700" fill="#1f6feb">查询 q</text><text x="52" y="298" font-size="12" fill="#1f2933">同一个 q</text>
<line x1="230" y1="300" x2="268" y2="300" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="270" y="250" width="200" height="100" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><path d="M280,250 V350 A10,10 0 0 1 270,340 V260 A10,10 0 0 1 280,250 Z" fill="#1f6feb"/><text x="292" y="276" font-size="14" font-weight="700" fill="#1f6feb">SupportNet</text><text x="292" y="298" font-size="12" fill="#1f2933">一次前向，输出 c 个</text><text x="292" y="317" font-size="12" fill="#1f2933">f_j(q) ≈ σ_Yj(q)</text>
<line x1="470" y1="300" x2="508" y2="300" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="510" y="250" width="200" height="100" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><path d="M520,250 V350 A10,10 0 0 1 510,340 V260 A10,10 0 0 1 520,250 Z" fill="#1f6feb"/><text x="532" y="276" font-size="14" font-weight="700" fill="#1f6feb">选簇</text><text x="532" y="298" font-size="12" fill="#1f2933">取前 s 个</text><text x="532" y="317" font-size="12" fill="#1f2933">（按最好能有多好）</text>
<line x1="710" y1="300" x2="748" y2="300" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="750" y="250" width="200" height="100" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><path d="M760,250 V350 A10,10 0 0 1 750,340 V260 A10,10 0 0 1 760,250 Z" fill="#1f6feb"/><text x="772" y="276" font-size="14" font-weight="700" fill="#1f6feb">簇内扫描</text><text x="772" y="298" font-size="12" fill="#1f2933">精确内积</text><text x="772" y="317" font-size="12" fill="#1f2933">返回候选</text>
<text x="30" y="398" font-size="15" font-weight="700" fill="#b5452b">KeyNet 改写</text>
<rect x="30" y="410" width="200" height="100" rx="10" fill="#ffffff" stroke="#b5452b" stroke-width="1.6"/><path d="M40,410 V510 A10,10 0 0 1 30,500 V420 A10,10 0 0 1 40,410 Z" fill="#b5452b"/><text x="52" y="436" font-size="14" font-weight="700" fill="#b5452b">查询 q</text><text x="52" y="458" font-size="12" fill="#1f2933">同一个 q</text>
<line x1="230" y1="460" x2="268" y2="460" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="270" y="410" width="200" height="100" rx="10" fill="#ffffff" stroke="#b5452b" stroke-width="1.6"/><path d="M280,410 V510 A10,10 0 0 1 270,500 V420 A10,10 0 0 1 280,410 Z" fill="#b5452b"/><text x="292" y="436" font-size="14" font-weight="700" fill="#b5452b">KeyNet</text><text x="292" y="458" font-size="12" fill="#1f2933">一次前向，输出</text><text x="292" y="477" font-size="12" fill="#1f2933">ŷ(q) ≈ y⋆(q)</text>
<line x1="470" y1="460" x2="508" y2="460" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="510" y="410" width="200" height="100" rx="10" fill="#ffffff" stroke="#b5452b" stroke-width="1.6"/><path d="M520,410 V510 A10,10 0 0 1 510,500 V420 A10,10 0 0 1 520,410 Z" fill="#b5452b"/><text x="532" y="436" font-size="14" font-weight="700" fill="#b5452b">原样的 IVF</text><text x="532" y="458" font-size="12" fill="#1f2933">用 ŷ 选簇、扫描</text><text x="532" y="477" font-size="12" fill="#1f2933">索引不用改</text>
<line x1="710" y1="460" x2="748" y2="460" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)" stroke-dasharray="5 4"/>
<rect x="750" y="410" width="200" height="100" rx="10" fill="#ffffff" stroke="#b5452b" stroke-width="1.6"/><path d="M760,410 V510 A10,10 0 0 1 750,500 V420 A10,10 0 0 1 760,410 Z" fill="#b5452b"/><text x="772" y="436" font-size="14" font-weight="700" fill="#b5452b">可选：重排</text><text x="772" y="458" font-size="12" fill="#1f2933">用原 q 给候选</text><text x="772" y="477" font-size="12" fill="#1f2933">重新打分（我加的）</text>
<line x1="30" y1="536" x2="950" y2="536" stroke="#c4bdb0" stroke-width="1" stroke-dasharray="4 4"/>
<text x="30" y="552" font-size="15" font-weight="700" fill="#8a6d3b">离线：一次性的摊销成本（语料和查询分布固定）</text>
<rect x="30" y="566" width="200" height="100" rx="10" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.6"/><path d="M40,566 V666 A10,10 0 0 1 30,656 V576 A10,10 0 0 1 40,566 Z" fill="#8a6d3b"/><text x="52" y="592" font-size="14" font-weight="700" fill="#8a6d3b">采样查询</text><text x="52" y="614" font-size="12" fill="#1f2933">真实查询 + 高斯噪声</text><text x="52" y="633" font-size="12" fill="#1f2933">σ = 0.02，再归一化</text>
<line x1="230" y1="616" x2="268" y2="616" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="270" y="566" width="200" height="100" rx="10" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.6"/><path d="M280,566 V666 A10,10 0 0 1 270,656 V576 A10,10 0 0 1 280,566 Z" fill="#8a6d3b"/><text x="292" y="592" font-size="14" font-weight="700" fill="#8a6d3b">穷举 MIPS</text><text x="292" y="614" font-size="12" fill="#1f2933">每个查询、每个簇</text><text x="292" y="633" font-size="12" fill="#1f2933">求精确的 y⋆_j(x)</text>
<line x1="470" y1="616" x2="508" y2="616" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="510" y="566" width="200" height="100" rx="10" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.6"/><path d="M520,566 V666 A10,10 0 0 1 510,656 V576 A10,10 0 0 1 520,566 Z" fill="#8a6d3b"/><text x="532" y="592" font-size="14" font-weight="700" fill="#8a6d3b">回归训练</text><text x="532" y="614" font-size="12" fill="#1f2933">约 1–10B 个样本</text><text x="532" y="633" font-size="12" fill="#1f2933">SupportNet / KeyNet</text>
<line x1="710" y1="616" x2="748" y2="616" stroke="#52606d" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="750" y="566" width="200" height="100" rx="10" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.6"/><path d="M760,566 V666 A10,10 0 0 1 750,656 V576 A10,10 0 0 1 760,566 Z" fill="#8a6d3b"/><text x="772" y="592" font-size="14" font-weight="700" fill="#8a6d3b">上线</text><text x="772" y="614" font-size="12" fill="#1f2933">小网络放在索引前面</text><text x="772" y="633" font-size="12" fill="#1f2933">语料一变就要重算</text>
</g></svg>